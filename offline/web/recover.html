<!doctype html>
<html lang="{{.L}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{t .L "recover.title"}}</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/wordlist.js"></script>
</head>
<body>
<main>
  <h1>{{t .L "recover.title"}}</h1>
  <p class="muted">{{t .L "recover.intro"}}</p>

  <form method="post" action="/recover" class="wide" id="recform">
    <input type="hidden" name="lang" value="{{.L}}">
    <div class="row noprint">
      <label class="inline">{{t .L "recover.partcount"}}
        <input type="number" id="partcount" value="2" min="1" max="16">
      </label>
      <label class="inline">{{t .L "recover.wordcount"}}
        <select id="wordcount">
          <option value="20">20</option>
          <option value="23" selected>23</option>
          <option value="26">26</option>
          <option value="33">33</option>
        </select>
      </label>
    </div>

    <div id="parts">
      {{range $p := .Parts}}
      <section class="part" data-part="{{$p}}">
        <h3>{{t $.L "recover.part" (inc $p)}} <span class="count muted"></span></h3>
        <div class="wordgrid">
          {{range $w := $.Words}}
          <label><span class="n">{{inc $w}}.</span><input type="text" name="p{{$p}}w{{$w}}"
            autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
            inputmode="latin" data-part="{{$p}}" data-idx="{{$w}}"></label>
          {{end}}
        </div>
      </section>
      {{end}}
    </div>

    <button type="submit">{{t .L "recover.submit"}}</button>

    <details>
      <summary>{{t .L "recover.paste.sum"}}</summary>
      <p class="muted">{{t .L "recover.paste.p"}}</p>
      <textarea name="mnemonics" rows="5" placeholder="{{ts .L "recover.paste.ph"}}"></textarea>
    </details>
  </form>
  <p><a href="/?lang={{.L}}">← {{t .L "nav.back"}}</a></p>
</main>

<script>
(function () {
  var WORDS = window.SLIP39_WORDS || [], N = window.SLIP39_PREFIX || 4;
  var PART_LABEL = "{{ts .L "recover.part" "@@"}}";
  var CONFIRM_WORDS = "{{ts .L "recover.confirm.words"}}";
  var CONFIRM_PARTS = "{{ts .L "recover.confirm.parts"}}";
  if (!WORDS.length) return;                 // without the list, leave the fields alone
  var byPrefix = {};
  WORDS.forEach(function (w) { byPrefix[w.slice(0, N)] = w; });

  var form = document.getElementById("recform");
  var parts = document.getElementById("parts");

  function inputs(part) {
    return Array.prototype.slice.call(part.querySelectorAll("input[type=text]"));
  }
  function allInputs() {
    return Array.prototype.slice.call(parts.querySelectorAll("input[type=text]"));
  }
  function clean(v) { return v.toLowerCase().replace(/[^a-z]/g, ""); }

  // Only the word boxes get completion. The controls above the grid are inputs
  // too, and stripping non-letters from a number field empties it.
  function isWord(el) {
    return !!el && el.tagName === "INPUT" && el.type === "text" && parts.contains(el);
  }

  // Complete a field: exact word wins, otherwise the four engraved letters do.
  function resolve(v) {
    if (!v) return null;
    if (WORDS.indexOf(v) >= 0) return v;
    if (v.length < N) return null;
    var full = byPrefix[v.slice(0, N)];
    return (full && full.indexOf(v) === 0) ? full : null;
  }

  function mark(el) {
    var v = clean(el.value);
    el.classList.remove("ok", "bad");
    if (!v) return;
    var full = resolve(v);
    if (full) { el.value = full; el.classList.add("ok"); }
    else if (v.length >= N) { el.classList.add("bad"); }
  }

  function counts() {
    Array.prototype.forEach.call(parts.querySelectorAll(".part"), function (p) {
      var ins = inputs(p), done = ins.filter(function (i) { return i.classList.contains("ok"); }).length;
      var badge = p.querySelector(".count");
      if (badge) badge.textContent = done + "/" + ins.length;
    });
  }

  function onInput(e) {
    var el = e.target;
    if (!isWord(el)) return;
    var v = clean(el.value);
    if (el.value !== v) el.value = v;
    var full = resolve(v);
    if (full && v.length >= N) {
      el.value = full;
      el.classList.remove("bad"); el.classList.add("ok");
      var all = allInputs(), i = all.indexOf(el);
      if (i >= 0 && i + 1 < all.length) all[i + 1].focus();
    } else {
      el.classList.remove("ok");
      if (v.length >= N) el.classList.add("bad"); else el.classList.remove("bad");
    }
    counts();
  }

  // Pasting a whole part into one box fills the boxes after it.
  function onPaste(e) {
    var el = e.target;
    if (!isWord(el)) return;
    var text = (e.clipboardData || window.clipboardData).getData("text") || "";
    var words = text.toLowerCase().split(/[^a-z]+/).filter(Boolean);
    if (words.length < 2) return;
    e.preventDefault();
    var all = allInputs(), start = all.indexOf(el);
    words.forEach(function (w, k) {
      var target = all[start + k];
      if (!target) return;
      target.value = w;
      mark(target);
    });
    var next = all[Math.min(start + words.length, all.length - 1)];
    if (next) next.focus();
    counts();
  }

  form.addEventListener("input", onInput);
  form.addEventListener("paste", onPaste);
  form.addEventListener("blur", function (e) {
    if (isWord(e.target)) { mark(e.target); counts(); }
  }, true);

  // Enter moves on instead of submitting a half-filled form.
  form.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" || !isWord(e.target)) return;
    e.preventDefault();
    var all = allInputs(), i = all.indexOf(e.target);
    if (i >= 0 && i + 1 < all.length) all[i + 1].focus(); else form.submit();
  });

  function buildPart(index, words) {
    var sec = document.createElement("section");
    sec.className = "part";
    sec.setAttribute("data-part", index);
    var grid = '<div class="wordgrid">';
    for (var i = 0; i < words; i++) {
      grid += '<label><span class="n">' + (i + 1) + '.</span><input type="text" name="p' +
        index + 'w' + i + '" autocomplete="off" autocapitalize="off" spellcheck="false"></label>';
    }
    grid += "</div>";
    sec.innerHTML = "<h3>" + PART_LABEL.replace("@@", index + 1) + ' <span class="count muted"></span></h3>' + grid;
    return sec;
  }

  var partCount = document.getElementById("partcount");

  function partSections() {
    return Array.prototype.slice.call(parts.querySelectorAll(".part"));
  }

  // Growing keeps what is already typed; shrinking asks before throwing
  // anything away.
  function setPartCount(n) {
    var secs = partSections(), cur = secs.length;
    if (n === cur) return;
    var words = inputs(secs[0]).length;
    if (n > cur) {
      for (var i = cur; i < n; i++) parts.appendChild(buildPart(i, words));
    } else {
      var loses = secs.slice(n).some(function (sec) {
        return inputs(sec).some(function (i) { return i.value !== ""; });
      });
      if (loses && !confirm(CONFIRM_PARTS)) {
        partCount.value = cur;
        return;
      }
      for (var j = cur - 1; j >= n; j--) parts.removeChild(secs[j]);
    }
    counts();
  }

  partCount.addEventListener("change", function () {
    var n = parseInt(this.value, 10);
    var cur = partSections().length;
    if (!(n >= 1 && n <= 16)) { this.value = cur; return; }
    setPartCount(n);
  });

  document.getElementById("wordcount").addEventListener("change", function () {
    var words = parseInt(this.value, 10);
    var filled = allInputs().some(function (i) { return i.value; });
    if (filled && !confirm(CONFIRM_WORDS)) return;
    var n = partSections().length;
    parts.innerHTML = "";
    for (var p = 0; p < n; p++) parts.appendChild(buildPart(p, words));
    counts();
  });

  counts();
})();
</script>
</body>
</html>
