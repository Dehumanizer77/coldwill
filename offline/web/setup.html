<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nový backup — inh</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <h1>Nový backup</h1>
  <p class="muted">Vygeneruje sa náhodný 128-bit key-file a rozdelí sa na časti.
  Štandard pre tento systém je <strong>2-z-3</strong>.</p>
  <form method="post" action="/setup">
    <label>Prah — koľko častí treba na obnovu
      <input type="number" name="threshold" value="2" min="1" max="16">
    </label>
    <label>Počet častí
      <input type="number" name="count" value="3" min="1" max="16">
    </label>
    <button type="submit">Vygenerovať</button>
  </form>
  <p><a href="/">← späť</a></p>
</main>
</body>
</html>
