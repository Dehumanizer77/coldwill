<!doctype html>
<html lang="{{.L}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{t .L "rbform.title"}}</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <h1>{{t .L "rbform.title"}}</h1>
  <p class="muted">{{t .L "rbform.intro"}}</p>

  <form method="post" action="/runbook">
    <fieldset>
      <legend>{{t .L "rbform.basics"}}</legend>
      <label>{{t .L "rbform.lang"}}
        <select name="lang">
          {{$cur := .L}}{{range langs}}<option value="{{.}}"{{if eq . $cur}} selected{{end}}>{{langName .}}</option>{{end}}
        </select>
      </label>
      <label>{{t .L "rbform.author"}} <input name="author" value="{{.Author}}"></label>
      <label>{{t .L "rbform.date"}} <input name="date" value="{{.Date}}"></label>
      <label>{{t .L "rbform.heir"}} <input name="heir" value="{{.Heir}}"></label>
    </fieldset>

    <fieldset>
      <legend>{{t .L "rbform.scheme"}}</legend>
      <label>{{t .L "rbform.threshold"}} <input type="number" name="threshold" value="{{.Threshold}}" min="1" max="16"></label>
      <label>{{t .L "rbform.count"}} <input type="number" id="count" name="count" value="{{.Count}}" min="1" max="16"></label>
    </fieldset>

    <fieldset>
      <legend>{{t .L "rbform.holders"}}</legend>
      <p class="muted">{{t .L "rbform.holders.p"}}</p>
      <div id="parts">
        {{range .Persons}}
        <div class="row">
          <span class="rownum"></span>
          <input name="person_name" placeholder="{{ts $.L "rbform.ph.name"}}" value="{{.Name}}">
          <input name="person_contact" placeholder="{{ts $.L "rbform.ph.contact"}}" value="{{.Contact}}">
          <select name="person_tech">
            <option value="nontech"{{if not .Tech}} selected{{end}}>{{t $.L "rbform.nontech"}}</option>
            <option value="tech"{{if .Tech}} selected{{end}}>{{t $.L "rbform.tech"}}</option>
          </select>
        </div>
        {{end}}
      </div>
    </fieldset>

    <fieldset>
      <legend>{{t .L "rbform.envelope"}}</legend>
      <label>{{t .L "rbform.bank"}} <input name="bank" value="{{.Bank}}" placeholder="{{ts .L "rbform.ph.bank"}}"></label>
      <label>{{t .L "rbform.toolurl"}}
        <input name="tool_url" value="{{.ToolURL}}" placeholder="https://github.com/…"></label>
      <label>{{t .L "rbform.toolwhere"}}
        <input name="tool_where" value="{{.ToolWhere}}" placeholder="{{ts .L "rbform.ph.toolwhere"}}"></label>
      <label>{{t .L "rbform.kdbx"}}
        <textarea name="kdbx_copies" rows="3" placeholder="{{ts .L "rbform.ph.kdbx"}}">{{.KdbxCopies}}</textarea>
      </label>
    </fieldset>

    <fieldset>
      <legend>{{t .L "rbform.extras"}}</legend>
      <label>{{t .L "rbform.wallet"}} <input name="wallet_notes" value="{{.WalletNotes}}"></label>
      <label>{{t .L "rbform.message"}}
        <textarea name="family_notes" rows="3">{{.FamilyNotes}}</textarea>
      </label>
    </fieldset>

    <button type="submit">{{t .L "rbform.submit"}}</button>
  </form>
  <p><a href="/?lang={{.L}}">← {{t .L "nav.home"}}</a></p>

  <template id="part-tpl">
    <div class="row">
      <span class="rownum"></span>
      <input name="person_name" placeholder="{{ts .L "rbform.ph.name"}}">
      <input name="person_contact" placeholder="{{ts .L "rbform.ph.contact"}}">
      <select name="person_tech">
        <option value="nontech">{{t .L "rbform.nontech"}}</option>
        <option value="tech">{{t .L "rbform.tech"}}</option>
      </select>
    </div>
  </template>

  <script>
    var ROW_LABEL = "{{ts .L "rbform.rownum" "@@"}}";
    function renumber(c) {
      for (var i = 0; i < c.children.length; i++) {
        var s = c.children[i].querySelector('.rownum');
        if (s) s.textContent = ROW_LABEL.replace("@@", i + 1);
      }
    }
    function setRows(n) {
      var c = document.getElementById('parts');
      var tpl = document.getElementById('part-tpl');
      while (c.children.length > n) c.removeChild(c.lastElementChild);
      while (c.children.length < n) c.appendChild(tpl.content.cloneNode(true));
      renumber(c);
    }
    function syncRows() {
      var n = parseInt(document.getElementById('count').value, 10);
      if (isNaN(n) || n < 1) n = 1;
      if (n > 16) n = 16;
      setRows(n);
    }
    document.addEventListener('DOMContentLoaded', function () {
      document.getElementById('count').addEventListener('input', syncRows);
      var c = document.getElementById('parts');
      if (c.children.length === 0) syncRows(); // fresh form: build from count
      else renumber(c);                        // pre-filled (edit): keep rows
    });
  </script>
</main>
</body>
</html>
