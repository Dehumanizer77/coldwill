<main>
  <h1>🔐 inh — offline Setup / Recovery</h1>
  <div class="cards">
    <a class="card" href="/setup">
      <h2>Nový backup</h2>
      <p class="muted">Vygeneruj key-file a rozdeľ ho na 3 časti (2-z-3).</p>
    </a>
    <a class="card" href="/recover">
      <h2>Obnova</h2>
      <p class="muted">Zlož 2 časti späť na key-file na otvorenie KeePass DB.</p>
    </a>
    <a class="card" href="/runbook">
      <h2>Runbook</h2>
      <p class="muted">Vytvor personalizovaný návod „kto-čo-kde" pre rodinu (vytlač / ulož ako PDF).</p>
    </a>
  </div>
</main>
