<!doctype html>
<html lang="{{.L}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{t .L "app.title"}}</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <h1>{{t .L "index.h1"}}</h1>
  <div class="cards">
    <a class="card" href="/setup?lang={{.L}}">
      <h2>{{t .L "index.setup.h"}}</h2>
      <p class="muted">{{t .L "index.setup.p"}}</p>
    </a>
    <a class="card" href="/recover?lang={{.L}}">
      <h2>{{t .L "index.recover.h"}}</h2>
      <p class="muted">{{t .L "index.recover.p"}}</p>
    </a>
    <a class="card" href="/runbook?lang={{.L}}">
      <h2>{{t .L "index.runbook.h"}}</h2>
      <p class="muted">{{t .L "index.runbook.p"}}</p>
    </a>
  </div>
  <p class="muted langpick">{{t .L "lang.label"}}:
    {{range langs}}<a href="/?lang={{.}}">{{langName .}}</a> {{end}}
  </p>
</main>
</body>
</html>
